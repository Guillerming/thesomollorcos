# Servidor local de la Bot API de Telegram: permite descargar archivos de hasta 2 GB.
# Lee TELEGRAM_API_ID y TELEGRAM_API_HASH del .env de este directorio.
services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.2
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?falta TELEGRAM_API_ID en .env}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?falta TELEGRAM_API_HASH en .env}
      TELEGRAM_LOCAL: "1"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./state/telegram-bot-api:/var/lib/telegram-bot-api
